name: UI-API-CICD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_tag:
        description: 'Enter the existing deployment tag, e.g. dev-1.0.6'
        required: true
        type: string

      component:
        description: 'Component to deploy'
        required: true
        type: choice
        options:
          - ui
          - api
          - both

permissions:
  contents: write
  id-token: write

# Prevent two automatic runs from consuming the same Vault version
concurrency:
  group: ui-api-cicd-version
  cancel-in-progress: false


# ============================================================
# Stage 0 - Get Version from Vault
# Automatic runs only
# ============================================================
jobs:

  get-version:
    name: Get Version
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          namespace: admin
          method: jwt
          path: jwt-github-actions
          role: ui-api-cicd
          jwtGithubAudience: https://github.com/Srikanthhanchate
          exportToken: true
          secrets: |
            secret/data/ui-api-cicd version | CURRENT_VERSION

      - name: Bump version
        id: version
        shell: bash
        run: |
          current="${{ env.CURRENT_VERSION }}"

          IFS='.' read -r major minor patch <<< "$current"

          version="$major.$minor.$((patch + 1))"

          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Current version: $current"
          echo "New version: $version"

      - name: Update version in Vault
        shell: bash
        run: |
          curl \
            --fail \
            --request POST \
            --header "X-Vault-Token: $VAULT_TOKEN" \
            --header "X-Vault-Namespace: admin" \
            --header "Content-Type: application/json" \
            --data "{\"data\":{\"version\":\"${{ steps.version.outputs.version }}\"}}" \
            "${{ vars.VAULT_ADDR }}/v1/secret/data/ui-api-cicd"


  # ============================================================
  # Stage 0 - Detect Changes
  # Automatic runs only
  # ============================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}
      infra_changed: ${{ steps.filter.outputs.infra }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'

            api:
              - 'api/**'

            infra:
              - 'infra/**'


  # ============================================================
  # Stage 1 - Terraform
  # Automatic runs only
  # Runs ONLY when infra changes
  # ============================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    needs:
      - get-version
      - detect-changes

    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.infra_changed == 'true'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve


  # ============================================================
  # Stage 2 - Build UI
  #
  # Automatic:
  #   Only when UI changed
  #
  # Manual:
  #   When component = ui OR both
  # ============================================================
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest

    needs:
      - get-version
      - detect-changes

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.ui_changed == 'true' &&
          (
            needs.get-version.result == 'success' &&
            needs.terraform.result == 'success'
          )
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.component == 'ui' ||
            inputs.component == 'both'
          )
        )
      )

    steps:

      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual deployment from tag: ${{ inputs.deployment_tag }}"
            npm run build
          else
            echo "Automatic deployment version: ${{ needs.get-version.outputs.version }}"
            VITE_APP_VERSION=${{ needs.get-version.outputs.version }} npm run build
          fi

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui/dist


  # ============================================================
  # Stage 3 - Build API
  #
  # Automatic:
  #   Only when API changed
  #
  # Manual:
  #   When component = api OR both
  # ============================================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest

    needs:
      - get-version
      - detect-changes

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.api_changed == 'true' &&
          (
            needs.get-version.result == 'success' &&
            needs.terraform.result == 'success'
          )
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.component == 'api' ||
            inputs.component == 'both'
          )
        )
      )

    steps:

      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build API
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: api/target/*.jar


  # ============================================================
  # Stage 4 - Deploy UI
  # ============================================================
  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest

    needs:
      - build-ui

    if: |
      always() &&
      needs.build-ui.result == 'success'

    steps:

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui-dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ui-api-cicd-ui-dev-2026
          package: ui-dist


  # ============================================================
  # Stage 5 - Deploy API
  # ============================================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest

    needs:
      - build-api

    if: |
      always() &&
      needs.build-api.result == 'success'

    steps:

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: api-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ui-api-cicd-api-dev-2026
          package: api-build


  # ============================================================
  # Stage 6 - Create Deployment Tag
  #
  # Automatic runs only
  #
  # Manual tag deployments NEVER create another tag
  # ============================================================
  tag:
    name: Create Deployment Tag
    runs-on: ubuntu-latest

    needs:
      - get-version
      - deploy-ui
      - deploy-api

    if: |
      github.event_name == 'push' &&
      always() &&
      (
        (
          needs.deploy-ui.result == 'success' &&
          needs.deploy-api.result == 'skipped'
        )
        ||
        (
          needs.deploy-ui.result == 'skipped' &&
          needs.deploy-api.result == 'success'
        )
        ||
        (
          needs.deploy-ui.result == 'success' &&
          needs.deploy-api.result == 'success'
        )
      )

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create deployment tag
        env:
          VERSION: ${{ needs.get-version.outputs.version }}

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "dev-$VERSION"
          git push origin "dev-$VERSION"