name: UI-API-CICD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # Stage 0 - Detect Changes
  # ============================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}
      infra_changed: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
            api:
              - 'api/**'
            infra:
              - 'infra/**'

  # ============================================================
  # Stage 1 - Terraform
  # ============================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

  # ============================================================
  # Stage 2 - Build UI
  # ============================================================
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - terraform

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui/dist

  # ============================================================
  # Stage 3 - Build API
  # ============================================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - terraform

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build API
        working-directory: api
        run: |  
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: api/target/*.jar

  # ============================================================
  # Stage 4 - Deploy UI
  # ============================================================
  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-ui

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui-dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ui-api-cicd-ui-dev-2026
          package: ui-dist

  # ============================================================
  # Stage 5 - Deploy API
  # ============================================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-api

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: api-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ui-api-cicd-api-dev-2026
          package: api-build